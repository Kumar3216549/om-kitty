<div id="root"><div style="padding:40px 16px;text-align:center;color:var(--muted)">Loading… · लोड हो रहा है…</div></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

/* ---------- Kitty config ----------
   Every kitty follows the same rules (discount/boli kitty, no foreman commission,
   3 caller bonuses, payable rounded up to the nearest ROUND_TO, optional promoter month).
   Only the name, members, installment, bonus amounts and promoter month change per kitty.
   These values are swapped in by applyKitty() before the App for a kitty renders. */
let CFG = { title: "Om Kitty - 2.5 Lakh", members: 25, pot: 250000, inst: 10000 };
let PROMOTER_MONTH = 3;      // promoter takes the full pot this month, every member pays the full installment (0 = none)
let PROMOTER_ID = "12";      // Sr. no. of the promoter
let BONUS = [{ rank: "2nd", label: "2nd Caller", amt: 500 }, { rank: "3rd", label: "3rd Caller", amt: 400 }, { rank: "4th", label: "4th Caller", amt: 200 }];
let BONUS_TOTAL = BONUS.reduce((s, b) => s + b.amt, 0);
const ROUND_TO = 100;        // payable rounded up to this; the extra goes to the promoter
let STORE_KEY = "omKitty.v1";
let KITTY = null;            // the active kitty definition

const REGISTRY_KEY = "kittyManager.registry.v1";
/* ---------- Language: the whole app is either fully English or fully Hindi ---------- */
const LANG_KEY = "kittyManager.lang";
let LANG = (() => { try { return localStorage.getItem(LANG_KEY) === "hi" ? "hi" : "en"; } catch (e) { return "en"; } })();
const tr = (en, hi) => (LANG === "hi" ? hi : en);
const rankName = (i) => tr(["2nd", "3rd", "4th"][i], ["दूसरा", "तीसरा", "चौथा"][i]);
const callerName = (i) => tr(["2nd Caller", "3rd Caller", "4th Caller"][i], ["दूसरा कॉलर", "तीसरा कॉलर", "चौथा कॉलर"][i]);
function LangToggle({ onToggle }) {
  return (
    <button type="button" onClick={onToggle} aria-label={LANG === "hi" ? "Switch to English" : "हिंदी में बदलें"}
      className="shrink-0 inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl font-semibold text-[14px] border border-line bg-surface2 hover:border-accent">
      <span aria-hidden="true">🌐</span> {LANG === "hi" ? "English" : "हिंदी"}
    </button>
  );
}
const DEFAULT_BONUS = [500, 400, 200];
const OM_NAMES = ["Gagan Mishra","Babula","Munna","Gopal Shaw","Mohan","Murari Pandiji","Pintu Kushwaha","Rajan Shukla","Umesh Ram","Rohan","Rohan II","Owner","Murari","Mahesh","Chandan Jha","Chunno","Raj Thakur","Ashish","Balmukund","Chunnu Bhaijee","Kallu","Masterji","Sachin Jha (Chunnu Bh.)","Satyam","Prahlad Jha"];
const OM_KITTY = { id: "om", title: "Om Kitty - 2.5 Lakh", members: 25, inst: 10000, bonus: DEFAULT_BONUS, promoterMonth: 3, promoterId: "12", names: OM_NAMES, storeKey: "omKitty.v1", sample: true };

function applyKitty(k) {
  KITTY = k;
  CFG = { title: k.title, members: Number(k.members), inst: Number(k.inst), pot: Number(k.members) * Number(k.inst) };
  PROMOTER_MONTH = Number(k.promoterMonth) || 0;
  PROMOTER_ID = String(k.promoterId || "");
  const b = (k.bonus && k.bonus.length === 3 ? k.bonus : DEFAULT_BONUS).map((x) => Number(x) || 0);
  BONUS = [{ rank: "2nd", label: "2nd Caller", amt: b[0] }, { rank: "3rd", label: "3rd Caller", amt: b[1] }, { rank: "4th", label: "4th Caller", amt: b[2] }];
  BONUS_TOTAL = BONUS.reduce((s, x) => s + x.amt, 0);
  STORE_KEY = k.storeKey || ("kitty." + k.id);
}
function loadRegistry() {
  try {
    const r = JSON.parse(localStorage.getItem(REGISTRY_KEY) || "null");
    if (r && Array.isArray(r.kitties) && r.kitties.length) return r;
  } catch (e) {}
  // First run: start with Om Kitty (keeps any data already saved in this browser)
  return { active: "om", kitties: [OM_KITTY] };
}
function saveRegistry(r) { try { localStorage.setItem(REGISTRY_KEY, JSON.stringify(r)); } catch (e) {} }
/* ---------- Accounts & online records (Firebase) ----------
   Sign in with Google · only @gmail.com accounts · each user sees only their own kitties.
   ADMIN_EMAIL can open every member's kitties and view or edit them.
   Leave FIREBASE_CONFIG.apiKey empty to run in the old "this browser only" mode. */
const FIREBASE_CONFIG = {
  apiKey: "",
  authDomain: "",
  projectId: "",
  storageBucket: "",
  messagingSenderId: "",
  appId: "",
};
const ADMIN_EMAIL = "sachin608@gmail.com";
const GMAIL_RE = /^[a-z0-9](?:[a-z0-9.+_-]*[a-z0-9])?@gmail\.com$/;
const CLOUD = { on: false, auth: null, db: null, user: null, ownerUid: null, ownerEmail: "", cache: {}, timers: {} };
try {
  if (FIREBASE_CONFIG.apiKey && window.firebase) {
    firebase.initializeApp(FIREBASE_CONFIG);
    CLOUD.auth = firebase.auth();
    CLOUD.db = firebase.firestore();
    CLOUD.on = true;
  }
} catch (e) { console.error("Firebase init failed", e); }
const isAdmin = () => !!(CLOUD.user && CLOUD.user.email === ADMIN_EMAIL);
const kittyCol = (uid) => CLOUD.db.collection("users").doc(uid).collection("kitties");
const KITTY_FIELDS = ["id", "title", "members", "inst", "bonus", "promoterMonth", "promoterId", "names", "sample"];
const pickCfg = (k) => { const o = {}; KITTY_FIELDS.forEach((f) => { if (k[f] !== undefined) o[f] = k[f]; }); return o; };
function cloudSaveState(kittyId, state) {
  if (!CLOUD.on || !CLOUD.ownerUid) return;
  const json = JSON.stringify(state);
  if (CLOUD.cache[kittyId] === json) return;
  CLOUD.cache[kittyId] = json;
  const owner = CLOUD.ownerUid, by = CLOUD.user ? CLOUD.user.email : "";
  clearTimeout(CLOUD.timers[kittyId]);
  CLOUD.timers[kittyId] = setTimeout(() => {
    kittyCol(owner).doc(kittyId).set({ state: json, updatedAt: firebase.firestore.FieldValue.serverTimestamp(), updatedBy: by }, { merge: true })
      .catch((e) => { console.error(e); window.dispatchEvent(new CustomEvent("kitty-save-error")); });
  }, 700);
}
async function cloudLoadKitties(uid) {
  const snap = await kittyCol(uid).get();
  const list = [];
  snap.forEach((d) => {
    const v = d.data();
    const k = { ...pickCfg(v), id: d.id, storeKey: "cloud." + uid + "." + d.id };
    if (v.state) CLOUD.cache[d.id] = v.state;
    list.push({ k, order: v.createdAt ? v.createdAt.toMillis() : 0 });
  });
  return list.sort((a, b) => a.order - b.order).map((x) => x.k);
}
async function cloudWriteKitty(uid, k, stateJson) {
  const data = { ...pickCfg(k), updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
  if (stateJson) data.state = stateJson;
  const ref = kittyCol(uid).doc(k.id);
  const ex = await ref.get();
  if (!ex.exists) data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
  await ref.set(data, { merge: true });
}
/* First sign-in on a phone that already has kitties saved locally: copy them to the account. */
async function migrateLocalKitties(uid) {
  let reg = null;
  try { reg = JSON.parse(localStorage.getItem(REGISTRY_KEY) || "null"); } catch (e) {}
  const kitties = reg && Array.isArray(reg.kitties) ? reg.kitties : [OM_KITTY];
  const moved = [];
  for (const k of kitties) {
    let raw = null;
    try { raw = localStorage.getItem(k.storeKey || ("kitty." + k.id)); } catch (e) {}
    if (!raw) continue;
    await cloudWriteKitty(uid, k, raw);
    moved.push(k.id);
  }
  return moved;
}

function LoginScreen({ error, busy, onGoogle, onLang }) {
  return (
    <div className="min-h-full grid place-items-center px-4 py-10">
      <div className="w-full max-w-md bg-surface border border-line rounded-3xl p-6 sm:p-8 flex flex-col gap-5">
        <div className="flex items-center gap-3">
          <div className="w-12 h-12 rounded-2xl bg-accent text-onAccent grid place-items-center font-extrabold text-2xl" aria-hidden="true">ॐ</div>
          <div className="flex-1 min-w-0">
            <h1 className="font-extrabold text-xl leading-tight">{tr("Kitty Manager", "किटी मैनेजर")}</h1>
            <p className="text-[13px] text-muted">{tr("Your kitties, saved safely in your account", "आपकी किटी, आपके अकाउंट में सुरक्षित")}</p>
          </div>
          <LangToggle onToggle={onLang} />
        </div>
        <button type="button" onClick={onGoogle} disabled={busy}
          className="inline-flex items-center justify-center gap-3 rounded-xl py-3 font-semibold border border-line bg-surface2 hover:border-accent disabled:opacity-60">
          <svg viewBox="0 0 48 48" className="w-5 h-5" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
          {busy ? tr("Signing in…", "साइन इन हो रहा है…") : tr("Sign in with Google", "Google से साइन इन करें")}
        </button>
        <p className="text-[13px] text-muted">{tr("Only Gmail accounts (name@gmail.com) can sign in. No password to remember — Google confirms it's you.", "सिर्फ़ Gmail अकाउंट (name@gmail.com) से साइन इन होगा। कोई पासवर्ड याद नहीं रखना — Google पुष्टि करता है कि यह आप हैं।")}</p>
        {error && <p className="text-[14px] bg-warnSoft text-warn rounded-xl p-3">{error}</p>}
      </div>
    </div>
  );
}

function AccountBar({ onLogout, onAdmin, viewing, onBackToMine }) {
  const me = CLOUD.user;
  return (
    <div className="bg-surface2 border-b border-line">
      <div className="max-w-6xl mx-auto px-4 py-1.5 flex flex-wrap items-center gap-2 text-[13px]">
        {me.photoURL && <img src={me.photoURL} alt="" className="w-6 h-6 rounded-full" referrerPolicy="no-referrer" />}
        <span className="font-semibold truncate max-w-[50vw]">{me.email}</span>
        {isAdmin() && <span className="px-2 py-0.5 rounded-full bg-goldSoft text-gold font-semibold">{tr("Admin", "एडमिन")}</span>}
        <span className="flex-1" />
        {isAdmin() && <button onClick={onAdmin} className="px-2.5 py-1 rounded-lg font-semibold bg-accentSoft text-accent">{tr("All members", "सभी सदस्य")}</button>}
        <button onClick={onLogout} className="px-2.5 py-1 rounded-lg font-semibold border border-line bg-surface">{tr("Sign out", "साइन आउट")}</button>
      </div>
      {viewing && (
        <div className="bg-goldSoft">
          <div className="max-w-6xl mx-auto px-4 py-2 flex flex-wrap items-center gap-2 text-[13.5px]">
            <span className="flex-1 min-w-0">{tr("Admin view: you are viewing and can edit the records of ", "एडमिन व्यू: आप इनके रिकॉर्ड देख और बदल रहे हैं: ")}<b>{viewing}</b></span>
            <button onClick={onBackToMine} className="px-3 py-1 rounded-lg font-semibold bg-surface border border-line">{tr("Back to my kitties", "मेरी किटी पर वापस")}</button>
          </div>
        </div>
      )}
    </div>
  );
}

function AdminPanel({ onOpen, onClose, onLang }) {
  const [rows, setRows] = useState(null);
  const [err, setErr] = useState("");
  const [q, setQ] = useState("");
  useEffect(() => {
    (async () => {
      try {
        const us = await CLOUD.db.collection("users").get();
        const list = [];
        for (const d of us.docs) {
          const v = d.data();
          const ks = await kittyCol(d.id).get();
          list.push({ uid: d.id, email: v.email || "", name: v.name || "", last: v.lastLogin ? v.lastLogin.toDate() : null, kitties: ks.docs.map((x) => x.data().title || x.id) });
        }
        list.sort((a, b) => (a.email === ADMIN_EMAIL ? -1 : b.email === ADMIN_EMAIL ? 1 : a.email.localeCompare(b.email)));
        setRows(list);
      } catch (e) { console.error(e); setErr(tr("Couldn't load members. Check the Firestore rules.", "सदस्य लोड नहीं हुए। Firestore नियम जाँचें।")); }
    })();
  }, []);
  const shown = (rows || []).filter((r) => !q || (r.email + " " + r.name).toLowerCase().includes(q.toLowerCase()));
  return (
    <div className="min-h-full">
      <header className="bg-surface border-b border-line">
        <div className="max-w-4xl mx-auto px-4 py-3 flex items-center gap-3">
          <div className="min-w-0 flex-1">
            <h1 className="font-extrabold text-[17px] sm:text-xl leading-tight">{tr("All members", "सभी सदस्य")}</h1>
            <p className="text-[12.5px] text-muted leading-tight">{tr("Everyone who has signed in. Open anyone's kitties to view or edit them.", "जिन्होंने भी साइन इन किया है। किसी की भी किटी खोलकर देखें या बदलें।")}</p>
          </div>
          <LangToggle onToggle={onLang} />
          <button onClick={onClose} className="px-3 py-1.5 rounded-xl font-semibold border border-line bg-surface2">{tr("Close", "बंद करें")}</button>
        </div>
      </header>
      <main className="max-w-4xl mx-auto px-4 py-5 flex flex-col gap-3">
        <input className="field" placeholder={tr("Search email or name", "ईमेल या नाम खोजें")} value={q} onChange={(e) => setQ(e.target.value)} />
        {err && <p className="text-[14px] bg-warnSoft text-warn rounded-xl p-3">{err}</p>}
        {!rows && !err && <p className="text-muted p-4">{tr("Loading…", "लोड हो रहा है…")}</p>}
        {shown.map((r) => (
          <div key={r.uid} className="bg-surface border border-line rounded-2xl p-4 flex flex-col sm:flex-row sm:items-center gap-3">
            <div className="flex-1 min-w-0">
              <p className="font-bold truncate">{r.name || r.email}{r.email === ADMIN_EMAIL && <span className="ml-2 text-[12px] px-2 py-0.5 rounded-full bg-goldSoft text-gold">{tr("Admin", "एडमिन")}</span>}</p>
              <p className="text-[13px] text-muted truncate">{r.email}{r.last ? " · " + tr("last seen ", "आख़िरी बार ") + r.last.toLocaleDateString(tr("en-IN", "hi-IN")) : ""}</p>
              <p className="text-[13px] mt-1">{r.kitties.length ? r.kitties.join(" · ") : <span className="text-muted">{tr("No kitties yet", "अभी कोई किटी नहीं")}</span>}</p>
            </div>

/* ---------- Core logic (no foreman commission) ---------- */
function calc(discountRaw, monthNo) {
  if (PROMOTER_MONTH && Number(monthNo) === PROMOTER_MONTH) {
    return { promoter: true, D: 0, winnerPayout: CFG.pot, dividendPot: 0, netDividend: 0, perExact: 0, payableExact: CFG.inst, perMember: 0, payable: CFG.inst, roundExtra: 0, expected: CFG.pot };
  }
  const D = Number(discountRaw);
  if (!D || D <= 0) return null;
  const winnerPayout = CFG.pot - D;
  const dividendPot = D;
  const netDividend = dividendPot - BONUS_TOTAL;
  const perExact = netDividend / CFG.members;
  const payableExact = CFG.inst - perExact;
  const payable = Math.ceil(Math.round(payableExact * 100) / 100 / ROUND_TO) * ROUND_TO;  // round UP to nearest ₹100
  const perMember = CFG.inst - payable;                                                      // effective dividend
  const expected = payable * CFG.members;
  const roundExtra = round2(expected - winnerPayout - BONUS_TOTAL);                          // goes to promoter
  return { promoter: false, D, winnerPayout, dividendPot, netDividend, perExact, payableExact, perMember, payable, roundExtra, expected };
}

function saveFile({ filename, data }) {
  const blob = data instanceof Blob ? data : new Blob([data], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  return Promise.resolve({ status: "saved" });
}

/* ---------- Kitty setup (create / edit) ---------- */
function Field({ id, label, hi, children }) {
  return <label className="flex flex-col gap-1.5" htmlFor={id}><span className="label">{hi ? tr(label, hi) : label}</span>{children}</label>;
}
function KittySetup({ initial, isNew, canDelete, onSave, onCancel, onDelete, onLang }) {
  const [f, setF] = useState(() => ({
    title: initial.title || "", members: String(initial.members || 20), inst: String(initial.inst || 5000),
    b2: String((initial.bonus || DEFAULT_BONUS)[0]), b3: String((initial.bonus || DEFAULT_BONUS)[1]), b4: String((initial.bonus || DEFAULT_BONUS)[2]),
    promoterMonth: String(initial.promoterMonth ?? 3), promoterId: String(initial.promoterId || "1"),
    names: (initial.names || []).join("\n"),
  }));
  const [err, setErr] = useState("");
  const [confirmDel, setConfirmDel] = useState(false);
  const set = (k) => (e) => setF((s) => ({ ...s, [k]: e.target.value }));
  const n = Math.max(0, Math.floor(Number(f.members) || 0));
  const inst = Number(f.inst) || 0;
  const nameList = f.names.split("\n").map((x) => x.trim());
  const names = Array.from({ length: n }, (_, i) => nameList[i] || (tr("Member ", "सदस्य ") + (i + 1)));
  const extraNames = nameList.filter(Boolean).length - n;

  const submit = (e) => {
    e.preventDefault();
    if (!f.title.trim()) return setErr(tr("Please enter a kitty name.", "किटी का नाम डालें।"));
    if (n < 2 || n > 100) return setErr(tr("Members must be between 2 and 100.", "सदस्य 2 से 100 के बीच होने चाहिए।"));
    if (inst <= 0) return setErr(tr("Please enter the monthly installment.", "महीने की किश्त डालें।"));
    const pm = Number(f.promoterMonth) || 0;
    if (pm < 0 || pm > n) return setErr(tr(`Promoter month must be between 0 and ${n}.`, `प्रमोटर महीना 0 से ${n} के बीच हो।`));
    onSave({
      title: f.title.trim(), members: n, inst, bonus: [Number(f.b2) || 0, Number(f.b3) || 0, Number(f.b4) || 0],
      promoterMonth: pm, promoterId: pm ? String(Math.min(n, Math.max(1, Number(f.promoterId) || 1))) : "", names,
    });
  };

  return (
    <div className="min-h-full">
      <header className="bg-surface border-b border-line">
        <div className="max-w-3xl mx-auto px-4 py-3 flex items-center gap-3">
          <div className="w-10 h-10 rounded-xl bg-accent text-onAccent grid place-items-center font-extrabold text-lg shrink-0" aria-hidden="true">+</div>
          <div className="min-w-0 flex-1">
            <h1 className="font-extrabold text-[17px] sm:text-xl leading-tight">{isNew ? tr("New kitty", "नई किटी बनाएँ") : tr("Kitty settings", "किटी सेटिंग")}</h1>
            <p className="text-[12.5px] text-muted leading-tight">{tr("Same rules for every kitty · boli (discount) kitty, caller bonus, ₹100 rounding", "हर किटी के नियम एक जैसे · बोली वाली किटी, कॉलर बोनस, ₹100 राउंडिंग")}</p>
          </div>
          <LangToggle onToggle={onLang} />
        </div>
      </header>
      <form onSubmit={submit} className="max-w-3xl mx-auto px-4 py-5 flex flex-col gap-5">
        <section className="bg-surface border border-line rounded-2xl p-4 sm:p-5 grid sm:grid-cols-2 gap-4">
          <div className="sm:col-span-2">
            <Field id="k-title" label="Kitty name" hi="किटी का नाम">
              <input id="k-title" className="field" placeholder={tr("e.g. Shiv Kitty - 1 Lakh", "जैसे शिव किटी - 1 लाख")} value={f.title} onChange={set("title")} />
            </Field>
          </div>
          <Field id="k-members" label="Members (= months)" hi="सदस्य (= महीने)">
            <input id="k-members" className="field num" type="number" inputMode="numeric" min="2" max="100" disabled={!isNew} value={f.members} onChange={set("members")} />
          </Field>
          <Field id="k-inst" label="Monthly installment (₹)" hi="महीने की किश्त (₹)">
            <input id="k-inst" className="field num" type="number" inputMode="numeric" min="1" step="any" value={f.inst} onChange={set("inst")} />
          </Field>
          <div className="sm:col-span-2 bg-accentSoft rounded-xl p-3 text-[14px]">
            {tr("Total pot", "कुल पॉट")}: <b className="num">{inr(n * inst)}</b> <span className="text-muted">{tr(`(${n} × ${inr(inst)} every month, ${n} months)`, `(हर महीने ${n} × ${inr(inst)}, ${n} महीने)`)}</span>
            {!isNew && <span className="block text-[12.5px] text-muted mt-1">{tr("Members count can't change after a kitty starts. Names and phones are edited from the Members list.", "किटी शुरू होने के बाद सदस्य संख्या नहीं बदलती। नाम और फ़ोन सदस्य सूची से बदलें।")}</span>}
          </div>
        </section>

        {isNew && (
          <section className="bg-surface border border-line rounded-2xl p-4 sm:p-5 flex flex-col gap-2">
            <Field id="k-names" label="Member names, one per line" hi="सदस्यों के नाम, हर लाइन में एक">
              <textarea id="k-names" className="field min-h-[180px]" placeholder={"Ramesh\nSuresh\nMahesh\n…"} value={f.names} onChange={set("names")} />
            </Field>
            <p className="text-[12.5px] text-muted">{tr(`${nameList.filter(Boolean).length} of ${n} names entered. Empty ones become "Member 1, Member 2…" and you can rename them later.`, `${n} में से ${nameList.filter(Boolean).length} नाम डाले गए। खाली नाम "सदस्य 1, सदस्य 2…" बनेंगे, बाद में बदल सकते हैं।`)}{extraNames > 0 ? tr(` ${extraNames} extra name(s) will be ignored.`, ` ${extraNames} अतिरिक्त नाम छोड़ दिए जाएँगे।`) : ""}</p>
          </section>
        )}

        <section className="bg-surface border border-line rounded-2xl p-4 sm:p-5 grid sm:grid-cols-3 gap-4">
          <p className="sm:col-span-3 font-bold">{tr("Caller bonus", "कॉलर बोनस")} <span className="text-muted font-medium text-sm">{tr("(paid from the boli before dividend)", "(लाभांश से पहले बोली में से दिया जाता है)")}</span></p>
          <Field id="k-b2" label="2nd caller ₹" hi="दूसरा कॉलर ₹"><input id="k-b2" className="field num" type="number" min="0" value={f.b2} onChange={set("b2")} /></Field>
          <Field id="k-b3" label="3rd caller ₹" hi="तीसरा कॉलर ₹"><input id="k-b3" className="field num" type="number" min="0" value={f.b3} onChange={set("b3")} /></Field>
          <Field id="k-b4" label="4th caller ₹" hi="चौथा कॉलर ₹"><input id="k-b4" className="field num" type="number" min="0" value={f.b4} onChange={set("b4")} /></Field>
        </section>

        <section className="bg-surface border border-line rounded-2xl p-4 sm:p-5 grid sm:grid-cols-2 gap-4">
          <p className="sm:col-span-2 font-bold">{tr("Promoter month", "प्रमोटर महीना")} <span className="text-muted font-medium text-sm">{tr("(no boli; promoter takes the full pot, everyone pays the full installment)", "(बोली नहीं; पूरा पॉट प्रमोटर को, सब पूरी किश्त देंगे)")}</span></p>
          <Field id="k-pm" label="Promoter month" hi="प्रमोटर महीना">
            <select id="k-pm" className="field" value={f.promoterMonth} onChange={set("promoterMonth")}>
              <option value="0">{tr("No promoter month", "कोई प्रमोटर महीना नहीं")}</option>
              {Array.from({ length: n }, (_, i) => <option key={i} value={i + 1}>{tr("Month", "महीना")} {i + 1}</option>)}
            </select>
          </Field>
          <Field id="k-pid" label="Promoter (member)" hi="प्रमोटर (सदस्य)">
            <select id="k-pid" className="field" disabled={f.promoterMonth === "0"} value={f.promoterId} onChange={set("promoterId")}>
              {(isNew ? names : (initial.memberList || names)).map((nm, i) => <option key={i} value={i + 1}>{i + 1}. {nm}</option>)}
            </select>
          </Field>
        </section>

        {err && <p className="text-[14px] bg-warnSoft text-warn rounded-xl p-3">{err}</p>}
        <div className="flex flex-wrap gap-2">
          <button type="submit" className="px-5 py-2.5 rounded-xl font-semibold bg-accent text-onAccent">{isNew ? tr("Create kitty", "किटी बनाएँ") : tr("Save settings", "सेटिंग सेव करें")}</button>
          {onCancel && <button type="button" onClick={onCancel} className="px-5 py-2.5 rounded-xl font-semibold bg-surface border border-line">{tr("Cancel", "रद्द करें")}</button>}
          {!isNew && canDelete && (confirmDel ? (
            <>
              <button type="button" onClick={onDelete} className="ml-auto px-4 py-2.5 rounded-xl font-semibold bg-warn" style={{ color: "var(--surface)" }}>{tr("Yes, delete", "हाँ, हटाएँ")}</button>
              <button type="button" onClick={() => setConfirmDel(false)} className="px-4 py-2.5 rounded-xl font-semibold bg-surface border border-line">{tr("No", "नहीं")}</button>
            </>
          ) : (
            <button type="button" onClick={() => setConfirmDel(true)} className="ml-auto px-4 py-2.5 rounded-xl font-semibold text-warn bg-surface border border-line">{tr("Delete this kitty", "यह किटी हटाएँ")}</button>
          ))}
        </div>
        <p className="text-[12.5px] text-muted">{tr("Tip: take a backup from inside the kitty before deleting. Every kitty's data stays only in this browser.", "सुझाव: हटाने से पहले किटी के अंदर से बैकअप ले लें। हर किटी का डेटा सिर्फ़ इसी ब्राउज़र में रहता है।")}</p>
      </form>
    </div>
  );
}

/* ---------- Root: many kitties, one app ---------- */
function Root() {
  const [lang, setLang] = useState(LANG);
  LANG = lang;
  useEffect(() => {
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
    document.documentElement.lang = lang;
  }, [lang]);
  const toggleLang = () => setLang((l) => (l === "hi" ? "en" : "hi"));
  if (!CLOUD.on) return <KittyHome cloud={false} onLang={toggleLang} lang={lang} />;
  return <CloudGate onLang={toggleLang} lang={lang} />;
}

function CloudGate({ onLang, lang }) {
  const [phase, setPhase] = useState("loading"); // loading | out | in
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const [owner, setOwner] = useState(null);       // { uid, email } whose kitties are shown
  const [kitties, setKitties] = useState(null);
  const [panel, setPanel] = useState(false);

  useEffect(() => CLOUD.auth.onAuthStateChanged(async (u) => {
    if (!u) { CLOUD.user = null; setPhase("out"); return; }
    const email = (u.email || "").toLowerCase();
    if (!GMAIL_RE.test(email) || !u.emailVerified) {
      await CLOUD.auth.signOut();
      setErr(tr("Only Gmail accounts (name@gmail.com) are allowed.", "सिर्फ़ Gmail अकाउंट (name@gmail.com) की अनुमति है।"));
      setPhase("out"); return;
    }
    CLOUD.user = u;
    try {
      await CLOUD.db.collection("users").doc(u.uid).set({ email, name: u.displayName || "", photo: u.photoURL || "", lastLogin: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
      await openOwner({ uid: u.uid, email }, true);
      setPhase("in");
    } catch (e) {
      console.error(e);
      setErr(tr("Signed in, but your records couldn't be loaded. Please try again.", "साइन इन हो गया, पर रिकॉर्ड लोड नहीं हुए। फिर से कोशिश करें।"));
      setPhase("out");
    }
  }), []);

  const openOwner = async (o, isSelf) => {
    CLOUD.cache = {};
    CLOUD.ownerUid = o.uid; CLOUD.ownerEmail = o.email;
    let list = await cloudLoadKitties(o.uid);
    if (isSelf && !list.length) {
      const moved = await migrateLocalKitties(o.uid);
      if (!moved.length && o.email === ADMIN_EMAIL) await cloudWriteKitty(o.uid, OM_KITTY, null);
      list = await cloudLoadKitties(o.uid);
    }
    setOwner(o); setKitties(list); setPanel(false);
  };

  const google = async () => {
    setErr(""); setBusy(true);
    try {
      const prov = new firebase.auth.GoogleAuthProvider();
      prov.setCustomParameters({ prompt: "select_account" });
      await CLOUD.auth.signInWithPopup(prov);
    } catch (e) {
      if (e && (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment")) {
        try { await CLOUD.auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider()); } catch (e2) { setErr(String(e2.message || e2)); }
      } else if (!(e && e.code === "auth/popup-closed-by-user")) {
        setErr(e && e.code === "auth/unauthorized-domain"
          ? tr("This website isn't allowed in Firebase yet. Add it under Authentication → Settings → Authorized domains.", "यह वेबसाइट अभी Firebase में अनुमति प्राप्त नहीं है। Authentication → Settings → Authorized domains में जोड़ें।")
          : String((e && e.message) || e));
      }
    }
    setBusy(false);
  };
  const logout = async () => { await CLOUD.auth.signOut(); CLOUD.cache = {}; setKitties(null); setOwner(null); };

  if (phase === "loading") return <p className="p-10 text-center text-muted">{tr("Loading…", "लोड हो रहा है…")}</p>;
  if (phase === "out" || !CLOUD.user) return <LoginScreen error={err} busy={busy} onGoogle={google} onLang={onLang} />;
  if (panel && isAdmin()) return <AdminPanel onClose={() => setPanel(false)} onLang={onLang} onOpen={(r) => openOwner({ uid: r.uid, email: r.email }, r.uid === CLOUD.user.uid)} />;
  if (!kitties) return <p className="p-10 text-center text-muted">{tr("Loading…", "लोड हो रहा है…")}</p>;
  const viewing = owner && owner.uid !== CLOUD.user.uid ? owner.email : "";
  return (
    <>
      <AccountBar onLogout={logout} onAdmin={() => setPanel(true)} viewing={viewing}
        onBackToMine={() => openOwner({ uid: CLOUD.user.uid, email: CLOUD.user.email.toLowerCase() }, true)} />
      <KittyHome key={owner.uid} cloud owner={owner} initialKitties={kitties} onLang={onLang} lang={lang} />
    </>
  );
}

function KittyHome({ cloud, owner, initialKitties, onLang, lang }) {
  const ACTIVE_KEY = cloud ? "kittyManager.active." + owner.uid : null;
  const [reg, setReg] = useState(() => {
    if (!cloud) return loadRegistry();
    let a = null; try { a = localStorage.getItem(ACTIVE_KEY); } catch (e) {}
    return { active: a, kitties: initialKitties };
  });
  const [mode, setMode] = useState(cloud && !initialKitties.length ? "new" : null); // null | "new" | "edit"
  useEffect(() => {
    if (!cloud) saveRegistry(reg);
    else { try { if (reg.active) localStorage.setItem(ACTIVE_KEY, reg.active); } catch (e) {} }
  }, [reg]);
  const active = reg.kitties.find((k) => k.id === reg.active) || reg.kitties[0];
  if (active) applyKitty(active);

  const create = (cfg) => {
    const id = slug(cfg.title) + "-" + Date.now().toString(36);
    const k = { ...cfg, id, storeKey: (cloud ? "cloud." + owner.uid + "." : "kitty.") + id };
    if (cloud) cloudWriteKitty(owner.uid, k, null).catch((e) => console.error(e));
    setReg((r) => ({ active: id, kitties: [...r.kitties, k] }));
    setMode(null);
  };
  const saveEdit = (cfg) => {
    const k2 = { ...active, ...cfg, members: active.members, names: active.names };
    if (cloud) cloudWriteKitty(owner.uid, k2, null).catch((e) => console.error(e));
    setReg((r) => ({ ...r, kitties: r.kitties.map((k) => (k.id === active.id ? k2 : k)) }));
    setMode(null);
  };
  const remove = () => {
    try { localStorage.removeItem(active.storeKey || ("kitty." + active.id)); } catch (e) {}
    if (cloud) { kittyCol(owner.uid).doc(active.id).delete().catch((e) => console.error(e)); delete CLOUD.cache[active.id]; }
    setReg((r) => { const left = r.kitties.filter((k) => k.id !== active.id); return { active: left[0] ? left[0].id : null, kitties: left }; });
    setMode(null);
  };

  if (mode === "new" || !active) return <KittySetup isNew initial={{}} onSave={create} onCancel={active ? () => setMode(null) : null} onLang={onLang} />;
  if (mode === "edit") {
    let memberList = null;
    try { const s = JSON.parse((cloud && CLOUD.cache[active.id]) || localStorage.getItem(STORE_KEY) || "null"); if (s && Array.isArray(s.members)) memberList = s.members.map((x) => x.name); } catch (e) {}
    return <KittySetup initial={{ ...active, memberList }} canDelete={reg.kitties.length > 1} onSave={saveEdit} onCancel={() => setMode(null)} onDelete={remove} onLang={onLang} />;
  }
  return <App key={active.id + ":" + lang + ":" + JSON.stringify([active.inst, active.bonus, active.promoterMonth, active.promoterId, active.title])}
    kitty={active} kitties={reg.kitties}
    onSwitch={(id) => setReg((r) => ({ ...r, active: id }))} onNew={() => setMode("new")} onEdit={() => setMode("edit")} onLang={onLang} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);

</script>

</body>
</html>
