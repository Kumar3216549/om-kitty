<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

/* ---------- Kitty config ---------- */
const CFG = { title: "Om Kitty - 2.5 Lakh", members: 25, pot: 250000, inst: 10000 };
const PROMOTER_MONTH = 3;      // promoter takes the full pot this month, every member pays full ₹10,000
const PROMOTER_ID = "12";      // "Owner"
const BONUS = [{ rank: "2nd", label: "2nd Caller", amt: 500 }, { rank: "3rd", label: "3rd Caller", amt: 400 }, { rank: "4th", label: "4th Caller", amt: 200 }];
const BONUS_TOTAL = BONUS.reduce((s, b) => s + b.amt, 0); // 1,100
const ROUND_TO = 100;          // payable rounded up to this; the extra goes to the promoter
const STORE_KEY = "omKitty.v1";

/* ---------- Core logic (no foreman commission) ---------- */
function calc(discountRaw, monthNo) {
  if (Number(monthNo) === PROMOTER_MONTH) {
    return { promoter: true, D: 0, winnerPayout: CFG.pot, dividendPot: 0, netDividend: 0, perExact: 0, payableExact: CFG.inst, perMember: 0, payable: CFG.inst, roundExtra: 0, expected: CFG.pot };
  }
  const D = Number(discountRaw);
  if (!D || D <= 0) return null;
  const winnerPayout = CFG.pot - D;
  const dividendPot = D;
  const netDividend = dividendPot - BONUS_TOTAL;
  const perExact = netDividend / CFG.members;
  const payableExact = CFG.inst - perExact;
  const payable = Math.ceil(Math.round(payableExact * 100) / 100 / ROUND_TO) * ROUND_TO;  // round UP to nearest ₹100
  const perMember = CFG.inst - payable;                                                      // effective dividend
  const expected = payable * CFG.members;
  const roundExtra = round2(expected - winnerPayout - BONUS_TOTAL);                          // goes to promoter
  return { promoter: false, D, winnerPayout, dividendPot, netDividend, perExact, payableExact, perMember, payable, roundExtra, expected };
}

/* ---------- Formatting ---------- */
const fmt = (n, dec = 0) => Number(n).toLocaleString("en-IN", { minimumFractionDigits: dec, maximumFractionDigits: 2 });
const inr = (n) => (n < 0 ? "−₹" : "₹") + fmt(Math.abs(n), Number.isInteger(Math.round(Math.abs(n) * 100) / 100) ? 0 : 2);
const rs = (n) => (n < 0 ? "-Rs. " : "Rs. ") + fmt(Math.abs(n), Number.isInteger(Math.round(Math.abs(n) * 100) / 100) ? 0 : 2);
const round2 = (n) => Math.round(n * 100) / 100;

/* ---------- Data ---------- */
const MEMBER_NAMES = ["Gagan Mishra","Babula","Munna","Gopal Shaw","Mohan","Murari Pandiji","Pintu Kushwaha","Rajan Shukla","Umesh Ram","Rohan","Rohan II","Owner","Murari","Mahesh","Chandan Jha","Chunno","Raj Thakur","Ashish","Balmukund","Chunnu Bhaijee","Kallu","Masterji","Sachin Jha (Chunnu Bh.)","Satyam","Prahlad Jha"];

function blankMembers() {
  return MEMBER_NAMES.map((name, i) => ({ id: i + 1, name, phone: "" }));
}
function sampleState() {
  return {
    isSample: false, current: 1, members: blankMembers(),
    months: {
      1: { discount: "94000", winnerId: "19", callers: ["Kallu", "Rajan Shukla", "Gagan Mishra"], payments: {} },
      [PROMOTER_MONTH]: { discount: "", winnerId: PROMOTER_ID, callers: ["", "", ""], payments: {} },
    },
  };
}
function freshState() { return { isSample: false, current: 1, members: blankMembers(), months: {} }; }
function emptyMonth() { return { discount: "", winnerId: "", callers: ["", "", ""], payments: {} }; }

function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      if (s && Array.isArray(s.members) && s.members.length === CFG.members && s.months) {
        const RENAME = { "Chunnu Baby": "Chunnu Bhaijee", "Chunnu Sala": "Sachin Jha (Chunnu Bh.)" };
        s.members = s.members.map((x) => (RENAME[x.name] ? { ...x, name: RENAME[x.name] } : x));
        const pm = s.months[PROMOTER_MONTH] || { discount: "", winnerId: "", callers: ["", "", ""], payments: {} };
        if (!pm.winnerId) s.months = { ...s.months, [PROMOTER_MONTH]: { ...pm, winnerId: PROMOTER_ID } };
        return s;
      }
    }
  } catch (e) {}
  return sampleState();
}

/* ---------- Small UI pieces ---------- */
function Icon({ name, className = "w-5 h-5" }) {
  const p = {
    pot: <><path d="M4 10h16l-1.5 9a2 2 0 0 1-2 1.7H7.5a2 2 0 0 1-2-1.7L4 10Z"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></>,
    fee: <><circle cx="12" cy="12" r="9"/><path d="M9 8h6M9 11h6M13 11c0 3-2 4-4 4l5 3"/></>,
    gift: <><rect x="3" y="8" width="18" height="5" rx="1"/><path d="M5 13v7h14v-7M12 8v12M12 8c-2-4-6-3-5 0M12 8c2-4 6-3 5 0"/></>,
    wallet: <><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M16 12h2M3 9h18"/></>,
    search: <><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></>,
    pdf: <><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5Z"/><path d="M14 3v5h5M9 14h6M9 17h4"/></>,
    wa: <><path d="M4 20l1.3-3.9A8 8 0 1 1 8 19l-4 1Z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1-1.5-2-1-1 .8a4 4 0 0 1-1.8-1.8l.8-1-1-2L9 9.5Z"/></>,
    copy: <><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></>,
    edit: <><path d="M4 20h4L19 9l-4-4L4 16v4Z"/></>,
    trophy: <><path d="M8 4h8v5a4 4 0 0 1-8 0V4ZM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 20h8"/></>,
    save: <><path d="M12 4v10M8 10l4 4 4-4M5 18h14"/></>,
    upload: <><path d="M12 16V6M8 10l4-4 4 4M5 18h14"/></>,
    lock: <><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></>,
    unlock: <><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 7.5-2"/></>,
  }[name];
  return <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" className={className} aria-hidden="true">{p}</svg>;
}

function SummaryCard({ icon, label, hi, value, sub }) {
  return (
    <div className="bg-surface border border-line rounded-2xl p-4 flex flex-col gap-1 min-w-0">
      <div className="flex items-center gap-2 text-muted">
        <span className="w-8 h-8 rounded-full bg-accentSoft text-accent grid place-items-center shrink-0"><Icon name={icon} className="w-4 h-4" /></span>
        <span className="text-[13px] font-semibold leading-tight">{label}<span className="block text-[12px] font-medium">{hi}</span></span>
      </div>
      <div className="num text-xl sm:text-2xl font-semibold mt-1 truncate">{value}</div>
      <div className="text-[12.5px] text-muted leading-snug">{sub}</div>
    </div>
  );
}

function LedgerRow({ op, label, hi, value, strong, tone }) {
  const color = tone === "gold" ? "text-gold" : tone === "warn" ? "text-warn" : "";
  return (
    <div className={"flex items-baseline gap-3 py-2 " + (strong ? "border-t border-line mt-1 pt-3" : "")}>
      <span className="num w-4 text-muted text-sm shrink-0 text-center">{op}</span>
      <span className={"flex-1 min-w-0 " + (strong ? "font-bold" : "")}>{label} <span className="text-muted text-[13px] font-normal">{hi}</span></span>
      <span className={"num text-right " + (strong ? "font-semibold text-[17px] " : "") + color}>{value}</span>
    </div>
  );
}

function saveFile({ filename, data }) {
  const blob = data instanceof Blob ? data : new Blob([data], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  return Promise.resolve({ status: "saved" });
}

/* ---------- App ---------- */
function App() {
  const [state, setState] = useState(loadState);
  const [query, setQuery] = useState("");
  const [editMembers, setEditMembers] = useState(false);
  const [toast, setToast] = useState("");
  const [confirmReset, setConfirmReset] = useState(false);
  const [dl, setDl] = useState(null);
  const fileRef = useRef(null);

  useEffect(() => { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }, [state]);
  useEffect(() => {
    let alive = true;
    try { window.claude?.use?.("downloads")?.then((d) => alive && setDl(d)).catch(() => {}); } catch (e) {}
    return () => { alive = false; };
  }, []);
  useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(""), 2600); return () => clearTimeout(t); }, [toast]);

  const m = state.current;
  const month = state.months[m] || emptyMonth();
  const c = calc(month.discount, m);
  const isPromoter = m === PROMOTER_MONTH;
  const locked = !!month.locked;
  const [confirmLock, setConfirmLock] = useState(false);
  const [confirmUnlock, setConfirmUnlock] = useState(false);
  useEffect(() => { setConfirmLock(false); setConfirmUnlock(false); }, [m]);
  const memberById = (id) => state.members.find((x) => String(x.id) === String(id));

  const updateMonth = (patch) => setState((s) => ({ ...s, months: { ...s.months, [s.current]: { ...(s.months[s.current] || emptyMonth()), ...patch } } }));
  const setPayment = (id, patch) => setState((s) => {
    const mo = s.months[s.current] || emptyMonth();
    const prev = mo.payments[id] || { paid: false, amount: "" };
    return { ...s, months: { ...s.months, [s.current]: { ...mo, payments: { ...mo.payments, [id]: { ...prev, ...patch } } } } };
  });
  const togglePaid = (id, paid) => {
    const prev = month.payments[id] || {};
    setPayment(id, { paid, amount: paid ? (prev.amount || (c ? String(round2(c.payable)) : String(CFG.inst))) : "" });
  };
  const closeMonth = () => { updateMonth({ locked: true, lockedAt: new Date().toISOString() }); setConfirmLock(false); setToast(`Month ${m} submit ho gaya · ab locked hai`); };
  const reopenMonth = () => { updateMonth({ locked: false }); setConfirmUnlock(false); setToast(`Month ${m} edit ke liye khul gaya`); };
  const updateMember = (id, patch) => setState((s) => ({ ...s, members: s.members.map((x) => (x.id === id ? { ...x, ...patch } : x)) }));

  /* Who has already lifted the pot, and in which month */
  const liftedIn = useMemo(() => {
    const map = {};
    Object.entries(state.months).forEach(([k, v]) => { if (v.winnerId) map[v.winnerId] = Number(k); });
    return map;
  }, [state.months]);

  /* Till-date totals */
  const totals = useMemo(() => {
    let auctions = 0, collected = 0, payout = 0, dividend = 0, extra = 0;
    Object.entries(state.months).forEach(([k, v]) => {
      const cc = calc(v.discount, k);
      if (cc && !cc.promoter) { auctions++; payout += cc.winnerPayout; dividend += cc.perMember * CFG.members; extra += cc.roundExtra; }
      Object.values(v.payments || {}).forEach((p) => { if (p.paid) collected += Number(p.amount) || 0; });
    });
    return { auctions, collected, payout, dividend, extra, bonus: auctions * BONUS_TOTAL };
  }, [state.months]);

  /* Consolidated report: only submitted (locked) months */
  const report = useMemo(() => {
    const rows = [];
    for (let k = 1; k <= CFG.members; k++) {
      const v = state.months[k];
      if (!v || !v.locked) continue;
      const cc = calc(v.discount, k);
      if (!cc) continue;
      const w = state.members.find((x) => String(x.id) === String(v.winnerId));
      const collected = Object.values(v.payments || {}).reduce((t, p) => t + (p.paid ? Number(p.amount) || 0 : 0), 0);
      rows.push({
        k, promoter: cc.promoter, winner: w ? w.name : "—", D: cc.D, boliPct: (cc.D / CFG.pot) * 100,
        winnerPayout: cc.winnerPayout, bonus: cc.promoter ? 0 : BONUS_TOTAL, perMember: cc.perMember,
        divPct: (cc.perMember / CFG.inst) * 100, payable: cc.payable, extra: cc.roundExtra,
        collected, expected: cc.expected, collPct: cc.expected ? (collected / cc.expected) * 100 : 0,
      });
    }
    const auc = rows.filter((x) => !x.promoter);
    const sum = (arr, f) => arr.reduce((t, x) => t + f(x), 0);
    const memberPaid = sum(rows, (x) => x.payable);
    const memberGross = rows.length * CFG.inst;
    const promoterIncome = sum(rows, (x) => x.extra) + sum(rows.filter((x) => x.promoter), (x) => x.winnerPayout);
    const collected = sum(rows, (x) => x.collected), expected = sum(rows, (x) => x.expected);
    return {
      rows, months: rows.length, auctions: auc.length,
      totalBoli: sum(auc, (x) => x.D), avgBoliPct: auc.length ? sum(auc, (x) => x.boliPct) / auc.length : 0,
      maxBoliPct: auc.length ? Math.max(...auc.map((x) => x.boliPct)) : 0, minBoliPct: auc.length ? Math.min(...auc.map((x) => x.boliPct)) : 0,
      winnerPaid: sum(rows, (x) => x.winnerPayout), bonus: sum(rows, (x) => x.bonus),
      dividendPerMember: sum(rows, (x) => x.perMember), memberPaid, memberGross,
      savePct: memberGross ? ((memberGross - memberPaid) / memberGross) * 100 : 0,
      promoterIncome, extra: sum(rows, (x) => x.extra), collected, expected, collPct: expected ? (collected / expected) * 100 : 0,
    };
  }, [state.months, state.members]);
  const pct = (n) => (Math.round(n * 100) / 100).toFixed(2) + "%";

  const paidCount = state.members.filter((x) => month.payments[x.id]?.paid).length;
  const collectedThisMonth = state.members.reduce((s, x) => s + (month.payments[x.id]?.paid ? Number(month.payments[x.id].amount) || 0 : 0), 0);
  const expected = c ? c.expected : CFG.inst * CFG.members;
  const collBarPct = Math.min(100, Math.round((collectedThisMonth / expected) * 100)) || 0;

  const q = query.trim().toLowerCase();
  const visible = state.members.filter((x) => !q || x.name.toLowerCase().includes(q) || (x.phone || "").includes(q));

  const monthStatus = (k) => {
    const v = state.months[k];
    if (!calc(v?.discount, k)) return "empty";
    const paid = state.members.filter((x) => v.payments?.[x.id]?.paid).length;
    return paid === CFG.members ? "done" : "partial";
  };

  /* ---------- Share text ---------- */
  const winner = memberById(month.winnerId);
  const pending = state.members.filter((x) => !month.payments[x.id]?.paid);
  const shareText = useMemo(() => {
    const L = [];
    L.push(`*${CFG.title}*`);
    L.push(`Month ${m} / ${CFG.members} ka hisaab`);
    L.push("");
    if (c && c.promoter) {
      L.push(`Promoter month: is mahine koi boli nahi.`);
      L.push(`Poora pot ${inr(CFG.pot)} promoter${winner ? " (" + winner.name + ")" : ""} ko.`);
      L.push("");
      L.push(`*Is mahine har member ko dena hai: ${inr(CFG.inst)} (full)*`);
    } else if (c) {
      L.push(`Winning discount (boli): ${inr(c.D)}`);
      L.push(`Winner: ${winner ? winner.name : "—"} · Payout ${inr(c.winnerPayout)}`);
      L.push(`Bonus: ${BONUS.map((b, i) => `${b.rank} ${month.callers[i] || "—"} ${inr(b.amt)}`).join(", ")}`);
      L.push(`Dividend per member (labhansh): ${inr(round2(c.perMember))}`);
      if (c.roundExtra) L.push(`₹100 rounding ka extra ${inr(c.roundExtra)} promoter ko`);
      L.push("");
      L.push(`*Is mahine har member ko dena hai: ${inr(round2(c.payable))}*`);
    } else {
      L.push(`Boli abhi baaki hai. Installment: ${inr(CFG.inst)}`);
    }
    if (month.locked) L.push("✅ Month submitted / closed");
    L.push(`Paid: ${paidCount}/${CFG.members}`);
    if (pending.length && pending.length < CFG.members) L.push(`Pending: ${pending.map((x) => x.name).join(", ")}`);
    L.push("");
    L.push("Dhanyavaad 🙏");
    return L.join("\n");

                <label className="flex flex-col gap-1.5" htmlFor="winner">
                  <span className="label">Winner · पॉट किसको मिला</span>
                  <select id="winner" disabled={locked} className="field" value={month.winnerId} onChange={(e) => updateMonth({ winnerId: e.target.value })}>
                    <option value="">Select winner…</option>
                    {state.members.map((x) => {
                      const lifted = liftedIn[x.id];
                      const taken = lifted && lifted !== m;
                      return <option key={x.id} value={x.id} disabled={taken}>{x.id}. {x.name}{taken ? ` (lifted M${lifted})` : ""}</option>;
                    })}
                  </select>
                </label>
                {BONUS.map((b, i) => (
                  <label key={b.rank} className="flex flex-col gap-1.5" htmlFor={"caller-" + i}>
                    <span className="label">{b.label} name · बोनस {inr(b.amt)}</span>
                    <input id={"caller-" + i} disabled={locked} className="field" list="member-names" placeholder={`${b.rank} highest bidder`}
                      value={month.callers[i] || ""} onChange={(e) => { const cl = [...(month.callers || ["", "", ""])]; cl[i] = e.target.value; updateMonth({ callers: cl }); }} />
                  </label>
                ))}
              </div>
              <datalist id="member-names">{state.members.map((x) => <option key={x.id} value={x.name} />)}</datalist>
              {warnLow && <p className="mt-4 text-[13.5px] bg-warnSoft text-warn rounded-xl p-3">Discount is below {inr(BONUS_TOTAL)} (total bonus), so the dividend comes out negative and members pay more than {inr(CFG.inst)}. Please check the boli amount.</p>}
              {warnHigh && <p className="mt-4 text-[13.5px] bg-warnSoft text-warn rounded-xl p-3">Discount is too high: the winner payout would be zero or less.</p>}
            </div>
            )}

            {/* Ledger breakdown + bonus */}
            <div className="grid md:grid-cols-5 gap-5">
              <div className="md:col-span-3 bg-surface border border-line rounded-2xl p-4 sm:p-5 min-w-0">
                <h2 className="font-bold">Hisaab <span className="text-muted font-medium text-sm">· How it's calculated</span></h2>
                {c && c.promoter ? (
                  <div className="mt-2 text-[14.5px]">
                    <LedgerRow op="" label="25 members × full installment" hi="" value={`25 × ${inr(CFG.inst)}`} />
                    <LedgerRow op="=" label="Full pot to promoter" hi="प्रमोटर" value={inr(CFG.pot)} strong />
                    <LedgerRow op="" label="Dividend / bonus" hi="" value="None" />
                    <LedgerRow op="=" label="Payable" hi="full" value={inr(CFG.inst)} strong />
                  </div>
                ) : c ? (
                  <div className="mt-2 text-[14.5px]">
                    <LedgerRow op="" label="Full pot" hi="कुल पॉट" value={inr(CFG.pot)} />
                    <LedgerRow op="−" label="Winning discount" hi="बोली" value={inr(c.D)} />
                    <LedgerRow op="=" label="Winner payout" hi="" value={inr(c.winnerPayout)} strong />
                    <div className="h-3" />
                    <LedgerRow op="" label="Discount" hi="डिविडेंड पॉट" value={inr(c.dividendPot)} />
                    <LedgerRow op="−" label="Total bonus" hi="" value={inr(BONUS_TOTAL)} tone="gold" />
                    <LedgerRow op="=" label="Net dividend" hi="" value={inr(c.netDividend)} strong tone={c.netDividend < 0 ? "warn" : ""} />
                    <LedgerRow op="÷" label="25 members" hi="" value={inr(round2(c.perExact)) + " each"} />
                    <LedgerRow op="" label="Exact payable" hi="₹10,000 − dividend" value={inr(round2(c.payableExact))} />
                    <LedgerRow op="=" label="Payable" hi="rounded up to ₹100" value={inr(c.payable)} strong />
                    <LedgerRow op="+" label="Rounding extra to promoter" hi={`25 × ${inr(round2(c.payable - c.payableExact))}`} value={inr(c.roundExtra)} tone="gold" />
                  </div>
                ) : (
                  <p className="mt-3 text-muted text-[14px]">Winning discount daalte hi poora hisaab yahan dikhega. Enter the winning discount to see the breakdown.</p>
                )}
              </div>
              <div className="md:col-span-2 bg-surface border border-line rounded-2xl p-4 sm:p-5 min-w-0">
                <h2 className="font-bold">Bonus list <span className="text-muted font-medium text-sm">· बोनस</span></h2>
                {isPromoter ? <p className="mt-3 text-muted text-[14px]">Promoter month mein bonus nahi milta.</p> : (
                <ul className="mt-3 flex flex-col gap-2">
                  {BONUS.map((b, i) => (
                    <li key={b.rank} className="flex items-center gap-3 bg-surface2 rounded-xl p-2.5">
                      <span className="num w-9 h-9 rounded-full bg-goldSoft text-gold grid place-items-center text-[13px] font-semibold shrink-0">{b.rank}</span>
                      <span className="flex-1 min-w-0 truncate">{month.callers[i] || <span className="text-muted">Not entered</span>}</span>
                      <span className="num font-semibold text-gold">{inr(b.amt)}</span>
                    </li>
                  ))}
                  <li className="flex justify-between pt-2 border-t border-line font-bold"><span>Total bonus</span><span className="num">{inr(BONUS_TOTAL)}</span></li>
                </ul>
                )}
                {winner && (
                  <div className="mt-4 flex items-center gap-3 bg-accentSoft rounded-xl p-3">
                    <Icon name="trophy" className="w-5 h-5 text-accent shrink-0" />
                    <div className="min-w-0"><p className="text-[12px] text-muted">{isPromoter ? "Promoter · पॉट मिला" : "Winner · पॉट मिला"}</p><p className="font-bold truncate">{winner.name}</p></div>
                  </div>
                )}
              </div>
            </div>
          </div>
        </section>

        {/* Members */}
        <section className="bg-surface border border-line rounded-2xl" aria-label="Members">
          <div className="p-4 sm:p-5 flex flex-col sm:flex-row sm:items-center gap-3 border-b border-line">
            <div className="flex-1">
              <h2 className="font-bold text-[17px]">Members <span className="text-muted font-medium text-sm">· सदस्य · Month {m}</span></h2>
              <p className="text-[13px] text-muted">Tick “Paid” to fill the payable amount automatically. Amount can be changed.</p>
            </div>
            <div className="flex gap-2 w-full sm:w-auto">
              <label className="relative flex-1 sm:w-64" htmlFor="search">
                <span className="sr-only">Search member</span>
                <span className="absolute left-3 top-1/2 -translate-y-1/2 text-muted"><Icon name="search" className="w-4 h-4" /></span>
                <input id="search" className="field !pl-9" placeholder="Search name / naam khojein" value={query} onChange={(e) => setQuery(e.target.value)} />
              </label>
              <button onClick={() => setEditMembers((v) => !v)} className={"shrink-0 inline-flex items-center gap-1.5 px-3 rounded-xl border font-semibold text-[14px] " + (editMembers ? "bg-accent text-onAccent border-transparent" : "bg-surface2 border-line")}>
                <Icon name="edit" className="w-4 h-4" /> {editMembers ? "Done" : "Edit"}
              </button>
            </div>
          </div>

          {/* Desktop table */}
          <div className="hidden md:block overflow-x-auto">
            <table className="w-full text-[14.5px]">
              <thead className="bg-surface2 text-left">
                <tr className="text-muted">
                  <th className="label px-5 py-3 w-16">Sr No</th>
                  <th className="label px-3 py-3">Member Name</th>
                  <th className="label px-3 py-3">Phone</th>
                  <th className="label px-3 py-3 text-center">Paid</th>
                  <th className="label px-5 py-3 text-right w-44">Amount Paid</th>
                </tr>
              </thead>
              <tbody>
                {visible.map((x) => {
                  const p = month.payments[x.id] || {};
                  const isWinner = String(month.winnerId) === String(x.id);
                  const lifted = liftedIn[x.id];
                  return (
                    <tr key={x.id} className="border-t border-line">
                      <td className="px-5 py-2.5 num text-muted">{String(x.id).padStart(2, "0")}</td>
                      <td className="px-3 py-2.5">
                        {editMembers ? <input id={"d-name-" + x.id} aria-label="Member name" className="field !py-1.5" value={x.name} onChange={(e) => updateMember(x.id, { name: e.target.value })} /> : (
                          <div className="flex items-center gap-2 flex-wrap">
                            <span className="font-semibold">{x.name}</span>
                            {isWinner && <span className="text-[11.5px] px-2 py-0.5 rounded-full bg-accentSoft text-accent font-semibold">Winner</span>}
                            {lifted && !isWinner && <span className="text-[11.5px] px-2 py-0.5 rounded-full bg-surface2 border border-line text-muted">Lifted M{lifted}</span>}
                          </div>
                        )}
                      </td>
                      <td className="px-3 py-2.5 num text-[13.5px]">
                        {editMembers ? <input id={"d-phone-" + x.id} aria-label="Phone" className="field !py-1.5 num" inputMode="tel" value={x.phone} onChange={(e) => updateMember(x.id, { phone: e.target.value })} /> : (x.phone || <span className="text-muted">—</span>)}
                      </td>
                      <td className="px-3 py-2.5 text-center">
                        <input id={"d-paid-" + x.id} disabled={locked} type="checkbox" className="chk" aria-label={"Paid: " + x.name} checked={!!p.paid} onChange={(e) => togglePaid(x.id, e.target.checked)} />
                      </td>
                      <td className="px-5 py-2.5 text-right">
                        <input id={"d-amt-" + x.id} disabled={locked} aria-label={"Amount paid by " + x.name} className="field !py-1.5 num text-right" type="number" inputMode="decimal" placeholder="0"
                          value={p.amount || ""} onChange={(e) => setPayment(x.id, { amount: e.target.value, paid: e.target.value !== "" && Number(e.target.value) > 0 })} />
                      </td>
                    </tr>
                  );
                })}
              </tbody>
              <tfoot>
                <tr className="border-t-2 border-line bg-surface2 font-bold">
                  <td className="px-5 py-3" colSpan={3}>Total · {paidCount}/{CFG.members} paid</td>
                  <td></td>
                  <td className="px-5 py-3 text-right num">{inr(round2(collectedThisMonth))}</td>
                </tr>
              </tfoot>
            </table>
          </div>

          {/* Mobile list */}
          <ul className="md:hidden divide-y" style={{ borderColor: "var(--line)" }}>
            {visible.map((x) => {
              const p = month.payments[x.id] || {};
              const isWinner = String(month.winnerId) === String(x.id);
              const lifted = liftedIn[x.id];
              return (
                <li key={x.id} className="px-4 py-3 flex flex-col gap-2 border-line">
                  <div className="flex items-center gap-3">
                    <span className="num w-9 h-9 rounded-full bg-surface2 border border-line grid place-items-center text-[13px] text-muted shrink-0">{String(x.id).padStart(2, "0")}</span>
                    <div className="flex-1 min-w-0">
                      {editMembers ? (
                        <div className="flex flex-col gap-1.5">
                          <input id={"m-name-" + x.id} aria-label="Member name" className="field !py-1.5" value={x.name} onChange={(e) => updateMember(x.id, { name: e.target.value })} />
                          <input id={"m-phone-" + x.id} aria-label="Phone" className="field !py-1.5 num" inputMode="tel" placeholder="Phone" value={x.phone} onChange={(e) => updateMember(x.id, { phone: e.target.value })} />
                        </div>
                      ) : (
                        <>
                          <div className="flex items-center gap-1.5 flex-wrap">
                            <span className="font-semibold truncate">{x.name}</span>
                            {isWinner && <span className="text-[11px] px-2 py-0.5 rounded-full bg-accentSoft text-accent font-semibold">Winner</span>}
                            {lifted && !isWinner && <span className="text-[11px] px-2 py-0.5 rounded-full bg-surface2 border border-line text-muted">M{lifted}</span>}
                          </div>
                          <div className="num text-[12.5px] text-muted">{x.phone || "No phone"}</div>
                        </>
                      )}
                    </div>
                    <label className="flex flex-col items-center gap-0.5 shrink-0" htmlFor={"m-paid-" + x.id}>
                      <input id={"m-paid-" + x.id} disabled={locked} type="checkbox" className="chk" checked={!!p.paid} onChange={(e) => togglePaid(x.id, e.target.checked)} />
                      <span className={"text-[11px] font-semibold " + (p.paid ? "text-accent" : "text-muted")}>{p.paid ? "Paid" : "Pending"}</span>
                    </label>
                  </div>
                  <div className="flex items-center gap-2 pl-12">
                    <span className="text-[12.5px] text-muted shrink-0">Amount ₹</span>
                    <input id={"m-amt-" + x.id} disabled={locked} aria-label={"Amount paid by " + x.name} className="field !py-1.5 num" type="number" inputMode="decimal" placeholder="0"
                      value={p.amount || ""} onChange={(e) => setPayment(x.id, { amount: e.target.value, paid: e.target.value !== "" && Number(e.target.value) > 0 })} />
                  </div>
                </li>
              );
            })}
            <li className="px-4 py-3 bg-surface2 flex justify-between font-bold rounded-b-2xl"><span>{paidCount}/{CFG.members} paid</span><span className="num">{inr(round2(collectedThisMonth))}</span></li>
          </ul>
          {visible.length === 0 && <p className="p-6 text-center text-muted">“{query}” naam ka koi member nahi mila.</p>}
        </section>

        {/* Consolidated report */}
        <section className="bg-surface border border-line rounded-2xl" aria-label="Consolidated report">
          <div className="p-4 sm:p-5 flex flex-col sm:flex-row sm:items-center gap-3 border-b border-line">
            <div className="flex-1 min-w-0">
              <h2 className="font-bold text-[17px]">Consolidated Report <span className="text-muted font-medium text-sm">· समेकित रिपोर्ट</span></h2>
              <p className="text-[13px] text-muted">Sirf submit (locked) mahine · {report.months} of {CFG.members} complete</p>
            </div>
            {report.months > 0 && (
              <div className="flex gap-2">
                <a href={reportWaHref} target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 px-3.5 py-2 rounded-xl font-semibold bg-accent text-onAccent"><Icon name="wa" className="w-4 h-4" /> Report</a>
                <button onClick={exportReportPdf} className="inline-flex items-center gap-2 px-3.5 py-2 rounded-xl font-semibold border border-line bg-surface2 hover:border-accent"><Icon name="pdf" className="w-4 h-4" /> Report PDF</button>
              </div>
            )}
          </div>
          {report.months === 0 ? (
            <p className="p-6 text-center text-muted text-[14px]">Abhi koi mahina submit nahi hua. Mahine ka hisaab poora karke "Submit / Month close" dabayein, report yahan banegi.</p>
          ) : (
            <>
              <div className="p-4 sm:p-5 grid grid-cols-2 lg:grid-cols-4 gap-3">
                <div className="bg-surface2 rounded-xl p-3 min-w-0"><p className="label">Avg boli %</p><p className="num text-xl font-semibold">{pct(report.avgBoliPct)}</p><p className="text-[12px] text-muted">High {pct(report.maxBoliPct)} · Low {pct(report.minBoliPct)}</p></div>
                <div className="bg-surface2 rounded-xl p-3 min-w-0"><p className="label">Member margin (bachat)</p><p className="num text-xl font-semibold text-accent">{pct(report.savePct)}</p><p className="text-[12px] text-muted">Diya {inr(report.memberPaid)} of {inr(report.memberGross)}</p></div>
                <div className="bg-surface2 rounded-xl p-3 min-w-0"><p className="label">Dividend / member</p><p className="num text-xl font-semibold">{inr(report.dividendPerMember)}</p><p className="text-[12px] text-muted">Total boli {inr(report.totalBoli)}</p></div>
                <div className="bg-surface2 rounded-xl p-3 min-w-0"><p className="label">Collection</p><p className="num text-xl font-semibold">{pct(report.collPct)}</p><p className="text-[12px] text-muted">{inr(round2(report.collected))} of {inr(report.expected)}</p></div>
              </div>
              <div className="overflow-x-auto border-t border-line">
                <table className="w-full text-[13.5px] tnum">
                  <thead className="bg-surface2 text-left">
                    <tr>
                      {["Month", "Winner", "Boli", "Boli %", "Winner payout", "Dividend / member", "Dividend %", "Payable", "Promoter extra", "Collected"].map((h) => <th key={h} className="label px-3 py-2.5 whitespace-nowrap">{h}</th>)}
                    </tr>
                  </thead>
                  <tbody>
                    {report.rows.map((x) => (
                      <tr key={x.k} className="border-t border-line">
                        <td className="px-3 py-2 num whitespace-nowrap">M{x.k}{x.promoter && <span className="ml-1.5 text-[11px] px-1.5 py-0.5 rounded-full bg-goldSoft text-gold font-sans font-semibold">Promoter</span>}</td>
                        <td className="px-3 py-2 whitespace-nowrap font-semibold">{x.winner}</td>
                        <td className="px-3 py-2 num text-right whitespace-nowrap">{x.promoter ? "—" : inr(x.D)}</td>
                        <td className="px-3 py-2 num text-right">{x.promoter ? "—" : pct(x.boliPct)}</td>
                        <td className="px-3 py-2 num text-right whitespace-nowrap">{inr(x.winnerPayout)}</td>
                        <td className="px-3 py-2 num text-right whitespace-nowrap">{inr(x.perMember)}</td>
                        <td className="px-3 py-2 num text-right text-accent">{pct(x.divPct)}</td>
                        <td className="px-3 py-2 num text-right whitespace-nowrap">{inr(x.payable)}</td>
                        <td className="px-3 py-2 num text-right text-gold">{inr(x.extra)}</td>
                        <td className="px-3 py-2 num text-right whitespace-nowrap">{inr(round2(x.collected))} <span className="text-muted text-[12px]">({pct(x.collPct)})</span></td>
                      </tr>
                    ))}
                  </tbody>
                  <tfoot>
                    <tr className="border-t-2 border-line bg-surface2 font-bold">
                      <td className="px-3 py-2.5" colSpan={2}>Total · {report.months} months</td>
                      <td className="px-3 py-2.5 num text-right whitespace-nowrap">{inr(report.totalBoli)}</td>
                      <td className="px-3 py-2.5 num text-right whitespace-nowrap">{pct(report.avgBoliPct)} avg</td>
                      <td className="px-3 py-2.5 num text-right whitespace-nowrap">{inr(report.winnerPaid)}</td>
                      <td className="px-3 py-2.5 num text-right whitespace-nowrap">{inr(report.dividendPerMember)}</td>
                      <td className="px-3 py-2.5 num text-right text-accent">{pct(report.savePct)}</td>
                      <td className="px-3 py-2.5 num text-right whitespace-nowrap">{inr(report.memberPaid)}</td>
                      <td className="px-3 py-2.5 num text-right text-gold whitespace-nowrap">{inr(report.extra)}</td>
                      <td className="px-3 py-2.5 num text-right whitespace-nowrap">{inr(round2(report.collected))}</td>
                    </tr>
                  </tfoot>
                </table>
              </div>
              <p className="px-4 sm:px-5 py-3 text-[12px] text-muted border-t border-line">Boli % = boli ÷ pot · Dividend % = dividend ÷ ₹10,000 kisht · Member margin = (kul kisht − asal diya) ÷ kul kisht · Promoter income ab tak: <b className="num">{inr(report.promoterIncome)}</b></p>
            </>
          )}
        </section>

        <p className="text-[12px] text-muted text-center pb-6">Formula: Winner = ₹2,50,000 − discount · Dividend = (discount − ₹1,100 bonus) ÷ 25 · Payable = ₹10,000 − dividend, rounded up to ₹100 (extra to promoter) · No foreman commission · Month {PROMOTER_MONTH}: promoter month, everyone pays full ₹10,000</p>
      </main>

      {/* Mobile sticky share */}
      <div className="sm:hidden fixed left-0 right-0 bottom-0 z-30 bg-surface border-t border-line px-4 pt-2 flex gap-2" style={{ paddingBottom: "calc(env(safe-area-inset-bottom, 0px) + 8px)" }}>
        <a href={waHref} target="_blank" rel="noopener noreferrer" className="flex-1 inline-flex items-center justify-center gap-2 rounded-xl py-2.5 font-semibold bg-accent text-onAccent"><Icon name="wa" className="w-4 h-4" /> WhatsApp</a>
        <button onClick={exportPdf} className={"flex-1 inline-flex items-center justify-center gap-2 rounded-xl py-2.5 font-semibold border border-line bg-surface2 " + (true ? "" : "opacity-50")}><Icon name="pdf" className="w-4 h-4" /> PDF</button>
      </div>
      <div className="sm:hidden h-20" />

      {toast && (
        <div role="status" className="fixed left-1/2 -translate-x-1/2 bottom-24 sm:bottom-6 z-40 px-4 py-2.5 rounded-xl shadow-lg text-[14px] font-semibold"
          style={{ background: "var(--fg)", color: "var(--bg)", maxWidth: "calc(100vw - 32px)" }}>{toast}</div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

</body>
</html>
